# Known-benign kernel-log patterns excluded from the splat_window oracle.
#
# Required fields per entry:
#   pattern  - Python regex matched against each candidate splat line
#   reason   - one-line justification; reference an ISSUES.md tag if applicable
#   expires  - YYYY-MM-DD; entries past their expiry fail at session-start
#              and force re-review (see _dmesg_allowlist.py)
#
# Optional:
#   applies_to - list of test-name regexes (matched against pytest nodeid).
#                Default: applies to all tests.
#
# Treat this file as a tripwire, not a graveyard. If you find yourself
# bumping `expires` without a fresh look at the underlying kernel
# behaviour, the entry has outlived its usefulness.

allowlist:
  - pattern: "rcu: RCU lockdep checking is enabled"
    reason: "CONFIG_PROVE_RCU boot announcement; not a real splat. Belt-and-braces in case SPLAT_RE broadens."
    expires: "2027-01-01"

  - pattern: '(={20,}|circular locking dependency detected|ppp_ioctl\+0x[0-9a-f]+/0x[0-9a-f]+ \[ppp_generic\])'
    reason: "ISSUES.md A13 — upstream ppp_generic lockdep WARNING (not deadlock): all_ppp_mutex ↔ rtnl_mutex inversion between ppp_ioctl path (mutex first, then rtnl_lock via register_netdev) and rtnetlink ppp_link_ops path (rtnl held, then all_ppp_mutex). Pre-existing in upstream Linux 6.12; surfaces once per boot on first PPPIOCNEWUNIT. Not introduced by ASK code. Pattern catches the lockdep banner (===), the WARNING line, and the PPP stack-trace line; applies_to scopes the broad banner-match to PPPoE tests only. Drop when upstream fix lands and we rebase past it."
    expires: "2026-10-01"
    applies_to:
      - "test_pppoe_e2e"
