# Acknowledged CDX_CMD_VAR(0, U16_MAX) commands.
#
# A PERMISSIVE entry on the FCI command bus means the dispatcher accepts
# *any* payload size — the handler owns rejection. The validator-table
# migration (ISSUES.md A1b/A1c) progressively tightens these toward
# EXACT / BOUNDED. Until a given command migrates, list it here with a
# brief reason, so a NEWLY-permissive command can't sneak past CI.
#
# Required fields per entry:
#   name    - exact CMD_* identifier as it appears in cdx headers
#   reason  - short justification (e.g. "body ignored", "inner handler validates length")
#
# When A1c migrates a command, drop its entry here. The validator-coverage
# test fails if the source has a permissive command not listed below — at
# which point either tighten the spec, or add an entry with a reason.

allowlist:
  - name: CMD_BRIDGED_ITF_UPDATE
    reason: "auto_bridge bridged-iface notification; pcmd passed through to abm with own validation"
  - name: CMD_RX_L2BRIDGE_MODE
    reason: "cdx-side noop"
  - name: CMD_RX_L2BRIDGE_FLOW_TIMEOUT
    reason: "cdx-side noop"
  - name: CMD_RX_L2BRIDGE_FLOW_RESET
    reason: "flushes all L2 bridge flows; no body interpretation"
  - name: CMD_VLAN_ENTRY_RESET
    reason: "ISSUES.md A1b; vlan reset accepts any length, handler ignores body"
  - name: CMD_IPV4_RESET
    reason: "wholesale conntrack flush; no body interpretation"
  - name: CMD_IPV6_RESET
    reason: "wholesale conntrack flush; no body interpretation"

  - name: CMD_IPSEC_RESET_SEC_FAILURE_STATS
    reason: "SEC stats reset validates its selector in the inner handler"
  - name: CMD_IPSEC_SA_FLUSH
    reason: "Flushes all SAs; handler ignores the body"
  - name: CMD_IPSEC_SEC_FAILURE_STATS
    reason: "SEC stats query validates its selector and preserves the existing byte-count reply"
  - name: CMD_QM_INGRESS_POLICER_RESET
    reason: "QM policer reset; no body interpretation"
  - name: CMD_QM_SEC_POLICER_RESET
    reason: "QM SEC policer reset; no body interpretation"
  - name: CMD_RTCP_QUERY
    reason: "RTCP query checks the minimum command length; covered by test_rtp_control.py"
  - name: CMD_RTP_OPEN
    reason: "Inner handler validates command length; covered by test_rtp_control.py"
  - name: CMD_RTP_CLOSE
    reason: "Inner handler validates command length; covered by test_rtp_control.py"
  - name: CMD_RTP_CONTROL
    reason: "Inner handler validates command length; covered by test_rtp_control.py"
  - name: CMD_RTP_UPDATE
    reason: "Inner handler validates command length; covered by test_rtp_control.py"
  - name: CMD_RTP_TAKEOVER
    reason: "Inner handler validates command length; covered by test_rtp_control.py"
  - name: CMD_RTP_SPECTX_PLD
    reason: "Command and payload bounds covered by test_rtp_control.py and host_tests/test_rtp_payload.py"
  - name: CMD_RTP_SPECTX_CTRL
    reason: "Inner handler validates command length; covered by test_rtp_control.py"
  - name: CMD_RTP_STATS_DTMF_PT
    reason: "Inner handler validates command length; covered by test_rtp_control.py"
  - name: CMD_WIFI_VAP_RESET
    reason: "Handler ignores the body and resets VAP state; covered by test_wifi_control.py"
