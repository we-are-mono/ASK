DISTRO = "ask"
DISTRO_NAME = "ASK Test Distro"
DISTRO_VERSION = "1.0"
MAINTAINER = "Tomaz Zaman <tomaz@mono.si>"

# The kernel lines this layer builds, side by side. ASK_LINE picks one per
# build; kas passes it in from the environment (.config.yaml, `make ask-image
# LINE=<line>`). A line is its kernel recipe (linux-ask_<line>.bb), its patch
# series (patches/kernel/<line>) and its NXP SDK copy (sdk/<line>).
ASK_LINES = "6.12 6.18"
PREFERRED_VERSION_linux-ask = "${ASK_LINE}%"
# Recipes that differ by line select on this override; an override cannot
# carry a dot, so 6.18 is ask618. A line this layer does not build stops the
# parse here rather than surface later as a missing linux-ask version.
ASK_LINE_OVERRIDE = "${@'ask' + d.getVar('ASK_LINE').replace('.', '') \
    if (d.getVar('ASK_LINE') or '') in d.getVar('ASK_LINES').split() \
    else bb.fatal('ASK_LINE %r is none of the kernel lines this layer builds (%s); ' \
                  'set it, as make ask-image LINE=<line> does' \
                  % (d.getVar('ASK_LINE') or '', d.getVar('ASK_LINES')))}"
DISTROOVERRIDES:append = ":${ASK_LINE_OVERRIDE}"
# A build tree per line -- its work, the prepared kernel source under
# work-shared, its deploy directory -- so the lines coexist and switching
# between them rebuilds neither.
TMPDIR = "${TOPDIR}/tmp-${ASK_LINE}"

# No systemd, no GUI, no package manager — this is a boot-to-shell test image.
# `ipv6` enables the ip6tables binary in the iptables build and unlocks
# IPv6 support in any other ipv6-feature-gated recipe (dnsmasq AAAA
# handling, etc.). Required for the FMAN tunnel-offload tests, which
# need ip6tables FORWARD rules to engage IPv6 conntrack tracking — the
# flowtable can only offload flows the kernel actually tracks.
DISTRO_FEATURES = "ipv6"

# This image uses `inherit image` (not core-image) with an explicit
# IMAGE_INSTALL, so only these two VIRTUAL-RUNTIMEs are actually read;
# initscripts/login_manager would only matter to packagegroups we don't
# install and merely restate oe-core defaults.
VIRTUAL-RUNTIME_init_manager = "busybox"
VIRTUAL-RUNTIME_base-utils   = "busybox"

# buildpaths QA is demoted in site.conf (the effective WARN+ERROR-remove
# pair). The ldflags demotion that used to live here never took effect —
# ERROR_QA wins and nothing removes it — and the build is clean, so it's gone.
