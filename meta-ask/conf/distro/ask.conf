DISTRO = "ask"
DISTRO_NAME = "ASK Test Distro"
DISTRO_VERSION = "1.0"
MAINTAINER = "Tomaz Zaman <tomaz@mono.si>"

# No systemd, no GUI, no package manager — this is a boot-to-shell test image.
# `ipv6` enables the ip6tables binary in the iptables build and unlocks
# IPv6 support in any other ipv6-feature-gated recipe (dnsmasq AAAA
# handling, etc.). Required for the FMAN tunnel-offload tests, which
# need ip6tables FORWARD rules to engage IPv6 conntrack tracking — CMM
# can only mirror flows the kernel actually tracks.
DISTRO_FEATURES = "ipv6"

# This image uses `inherit image` (not core-image) with an explicit
# IMAGE_INSTALL, so only these two VIRTUAL-RUNTIMEs are actually read;
# initscripts/login_manager would only matter to packagegroups we don't
# install and merely restate oe-core defaults.
VIRTUAL-RUNTIME_init_manager = "busybox"
VIRTUAL-RUNTIME_base-utils   = "busybox"

# buildpaths QA is demoted in site.conf (the effective WARN+ERROR-remove
# pair). The ldflags demotion that used to live here never took effect —
# ERROR_QA wins and nothing removes it — and the build is clean, so it's gone.
