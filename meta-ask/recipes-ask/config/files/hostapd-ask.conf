# Test-image access point.
#
# Exists so the Wi-Fi offload path has something to carry without a human
# configuring a radio first: the board comes up advertising `ask-test` and a
# client can associate and be driven from the orchestrator.
#
# uap0 is the AP-mode interface of the first 88W9098 radio (PCI 01:00.0).
# The second radio's (muap0) is deliberately left alone, so it stays
# available as a station for a loopback functional test that needs no
# external client.
interface=uap0
driver=nl80211
ctrl_interface=/var/run/hostapd

ssid=ask-test
# WPA2-PSK. Eight characters is the minimum a WPA passphrase may be, and
# this is exactly that -- it is a bench credential on an isolated rig, not a
# secret, and it is in the image in clear text precisely because it is not
# one. Do not carry this file into a production build.
wpa=2
wpa_passphrase=ask-test
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# 2.4 GHz, channel 6. Chosen over 5 GHz because it needs no regulatory
# database to key on and no DFS wait, so the AP is up immediately on every
# boot. Throughput work should move to 5 GHz explicitly rather than inherit
# this: 802.11n at 20 MHz here is nowhere near what the radio can do, and a
# client that caps first measures the client.
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# A real ISO code, not the "00" world domain: this hostapd validates the
# field and refuses 00 outright ("Invalid country_code"), which is a whole
# AP that silently never starts. SI matches where the bench is; the value
# only sets regulatory limits, and the regulatory database that backs it is
# in the image as wireless-regdb-static.
country_code=SI
