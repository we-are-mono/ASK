# Test image only: classify on ct mark bits 0xf0, so the suite exercises the
# hardware HTB path (test_profile_isp's QoS case) instead of skipping it.
# A boot-time ask_flowtable.qos_mark_mask= on the kernel command line still
# overrides this, because kmod applies command-line options after these.
options ask_flowtable qos_mark_mask=0xf0
