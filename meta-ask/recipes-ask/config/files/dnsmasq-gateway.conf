interface=eth3
# The Wi-Fi AP's own subnet. uap0 is addressed by S35wifi-ap, which runs
# before this is started — bind-interfaces means an interface that does not
# yet carry its address is refused outright rather than picked up later.
interface=uap0
bind-interfaces
listen-address=192.168.1.1
listen-address=192.168.2.1
# Each range sets a tag so its own router option can be selected; an
# untagged dhcp-option would be offered to both subnets and hand Wi-Fi
# clients the wired gateway.
dhcp-range=set:lan,192.168.1.100,192.168.1.200,24h
dhcp-range=set:wlan,192.168.2.100,192.168.2.200,24h
dhcp-option=tag:lan,option:router,192.168.1.1
dhcp-option=tag:wlan,option:router,192.168.2.1
# Point DHCP clients straight at Cloudflare — the target itself runs
# dnsmasq with port=0 (DNS disabled, DHCP-only), so a previous value
# of 192.168.1.1 here advertised a DNS server that wasn't listening.
dhcp-option=option:dns-server,1.1.1.1
port=0
