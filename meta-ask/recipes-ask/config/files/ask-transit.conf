# Test image only: carry transit ESP, GRE, IPIP and 6in4 in hardware, so the
# suite exercises the transit miss chain (docs/flowtable/transit.md) rather
# than the driver's default, which leaves it off for every frame's sake. A
# boot-time cdx.transit= on the kernel command line still overrides this,
# because kmod applies command-line options after these.
options cdx transit=1
