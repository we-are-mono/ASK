# Throughput measurement on this branch: drop the runtime-costly debug
# options ask.cfg turns on, so CPU-bound paths (WireGuard) measure close to
# a production kernel. Not a test image for the suite.
# CONFIG_PROVE_LOCKING is not set
# CONFIG_DEBUG_LOCK_ALLOC is not set
# CONFIG_LOCK_STAT is not set
# CONFIG_DEBUG_SPINLOCK is not set
# CONFIG_DEBUG_MUTEXES is not set
# CONFIG_DEBUG_RWSEMS is not set
# CONFIG_DEBUG_RT_MUTEXES is not set
# CONFIG_DEBUG_ATOMIC_SLEEP is not set
# CONFIG_DEBUG_KMEMLEAK is not set
# CONFIG_KFENCE is not set
# CONFIG_UBSAN is not set
# CONFIG_FAILSLAB is not set
# CONFIG_FAULT_INJECTION is not set
# DPAA hardware timestamping compiles out Tx buffer recycling: every
# forwarded frame is confirmed, freed and its Rx buffer reallocated.
# CONFIG_FSL_DPAA_1588 is not set
# CONFIG_FSL_DPAA_TS is not set
