# ASK hardware flow-offload policy — /etc/ask/offload.conf
#
# This file is optional. If it is absent the ask-flowtable daemon uses exactly
# the defaults below, so out of the box every eligible forwarded flow (wire and
# Wi-Fi) is offloaded across the up CDX physical ports, with no configuration.
#
# Format: one "key value..." directive per line; '#' begins a comment.
#
#   enabled  yes|no                 default yes
#   devices  auto | <if> <if> ...   auto = all up CDX physical ports (fsl_dpa)
#   scope    <match> | any          repeatable; which established flows to offload
#   exclude  <match>                repeatable; keep these in software
#
# A <match> is any combination of:
#   tcp | udp                       protocol (shorthand)
#   <port> | <lo>-<hi>              port, matched on any of the flow's ports
#   <cidr> [ -> <cidr> ]            source [and destination] address
#   proto tcp|udp | saddr/daddr/sport/dport (and reply-*) | port N | mark v/m | name TEXT
#
# The daemon checks policy and backend health every five seconds, with bounded
# retries after failure. Interface events also prompt a check. Manual apply or
# stop pauses these checks across process restarts; resume returns control to
# this configuration: ask-flowtable resume (or /etc/init.d/ask-flowtable reload).
# For firewall maintenance: stop acceleration first, change firewall/policy,
# then resume. Publish edits atomically so the daemon reads a complete file.

enabled yes
devices auto
scope any

# Application-layer gateways whose helpers break if the control channel is
# accelerated past conntrack. Keep these in software.
exclude tcp 21      # FTP control
exclude udp 5060    # SIP
exclude tcp 1723    # PPTP control
