# ASK Fast Path kernel modules, loaded in order.
cdx
# Connection tracking, which the Linux flowtable offloads from.
nf_conntrack
nf_conntrack_netlink
# iptables conntrack match - needed to activate connection tracking
xt_conntrack
# Wi-Fi radio (NXP 88W9098 over PCIe). mlan is the chip library and must
# precede moal, which is the driver that registers the netdevs. Loaded from
# here rather than by modules-load.d: this initramfs has nothing that reads
# it, which is why KERNEL_MODULE_AUTOLOAD alone left them unloaded.
mlan
moal
